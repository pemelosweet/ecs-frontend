# xmg111.xyz 生产 nginx 配置（部署到 ECS：/etc/nginx/conf.d/xmg.conf）
# 复用已有 Let's Encrypt 证书，反代 /parse 到本机 Parse Server（pm2 常驻 :1337）

# ==================== admin.xmg111.xyz (管理后台) ====================
server {
    listen 80;
    server_name admin.xmg111.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.xmg111.xyz;

    ssl_certificate     /etc/letsencrypt/live/admin.xmg111.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xmg111.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Parse API 反代（前端 SDK 走相对路径 /parse）
    location /parse/ {
        proxy_pass         http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # 头像上传限制，与 Parse Server maxUploadSize 保持一致
        client_max_body_size 10m;
    }

    # Parse Dashboard 看板（账号见后端 .env，生产请改强密码）
    location /dashboard/ {
        proxy_pass         http://127.0.0.1:1337;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 管理后台静态产物（SPA history 路由回退）
    location / {
        root  /var/www/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ==================== xmg111.xyz (博客) ====================
server {
    listen 80;
    server_name xmg111.xyz;

    # 博客也要调 /parse 拉档案数据（公开读，无需登录）
    location /parse/ {
        proxy_pass         http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        root  /var/www/blog;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        root /var/www/blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

