server {
    listen 80;
    server_name admin.xmg111.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.xmg111.xyz;

    ssl_certificate     /etc/letsencrypt/live/admin.xmg111.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xmg111.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 反向代理：前端 /api 转发到后端容器（对应 compose 中的服务名 backend）
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 禁止浏览器缓存接口响应，避免配置/数据更新后仍命中旧 HTML 缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma        "no-cache" always;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# ==================== xmg111.xyz (博客站点) ====================
# 博客内容由宿主机 /opt/blog/public 挂载到 /usr/share/nginx/blog
# HTTP：直接服务，不做 HTTPS 跳转
server {
    listen 80;
    server_name xmg111.xyz;

    location / {
        root  /usr/share/nginx/blog;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        root /usr/share/nginx/blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS：与 HTTP 内容完全一致
server {
    listen 443 ssl;
    server_name xmg111.xyz;

    ssl_certificate     /etc/letsencrypt/live/xmg111.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmg111.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location / {
        root  /usr/share/nginx/blog;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        root /usr/share/nginx/blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
