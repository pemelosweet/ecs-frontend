server {
    listen 80;
    server_name admin.xmg111.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.xmg111.xyz;

    ssl_certificate     /etc/letsencrypt/live/admin.xmg111.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xmg111.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 反向代理：前端 /api 转发到后端容器（对应 compose 中的服务名 backend）
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
