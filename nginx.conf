server {
    listen 80;
    server_name admin.xmg111.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.xmg111.xyz;

    ssl_certificate     /etc/letsencrypt/live/admin.xmg111.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xmg111.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 反向代理：前端 /api 转发到后端容器（对应 compose 中的服务名 backend）
    location /api/ {
        include /etc/nginx/api-proxy.inc;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

# ==================== xmg111.xyz (博客站点) ====================
# 博客内容由宿主机 /opt/blog/public 挂载到 /usr/share/nginx/blog
# HTTP：直接服务，不做 HTTPS 跳转
server {
    listen 80;
    server_name xmg111.xyz;

    # 与 admin.xmg111.xyz 共用同一后端
    location /api/ {
        include /etc/nginx/api-proxy.inc;
    }

    location / {
        root  /usr/share/nginx/blog;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        root /usr/share/nginx/blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

# HTTPS：与 HTTP 内容完全一致
server {
    listen 443 ssl;
    server_name xmg111.xyz;

    ssl_certificate     /etc/letsencrypt/live/xmg111.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmg111.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    location /api/ {
        include /etc/nginx/api-proxy.inc;
    }

    location / {
        root  /usr/share/nginx/blog;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        root /usr/share/nginx/blog;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
