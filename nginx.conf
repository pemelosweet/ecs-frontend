# HTTP：域名访问一律跳转 HTTPS
server {
    listen 80;
    server_name xmg111.xyz;
    return 301 https://$host$request_uri;
}

# HTTP：IP 直连仍走 80（兜底，方便调试）
server {
    listen 80 default_server;
    server_name _;

    # 前端静态文件（SPA 路由兜底）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 60m;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name xmg111.xyz;

    # Let's Encrypt 证书（由宿主机 /etc/letsencrypt 挂载进容器）
    ssl_certificate /etc/letsencrypt/live/xmg111.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xmg111.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 前端静态文件（SPA 路由兜底）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端容器
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 60m;
    }
}
