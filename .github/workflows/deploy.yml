# 生产自动部署：push 后由 ECS 自托管 runner 执行一键更新
name: Deploy

on:
  push:
    branches: [main]
  # 其他仓库 push 后通过 repository_dispatch 触发本 workflow
  repository_dispatch:
    types: [deploy]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      # 生产 .env 单一数据源：GitHub Secrets 的 PROD_ENV，每次部署下发，禁止手改服务器文件
      - name: 下发生产 .env
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          if [ -z "$PROD_ENV" ]; then echo "缺少 PROD_ENV secret，终止"; exit 1; fi
          printf '%s\n' "$PROD_ENV" > /opt/xmg/ecs-test-servers/.env
      - name: 执行一键更新
        run: bash /opt/xmg/ecs-frontend/deploy/update.sh
